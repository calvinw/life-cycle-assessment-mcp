<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img">
<title>The two processes at their reference flows</title>
<desc>Fuel production consumes 50 litres of crude oil, outputs 100 litres of fuel, and emits 30 kilograms of carbon dioxide and 10 kilograms of methane. Electricity production consumes 2 litres of fuel, outputs 10 kilowatt hours, and emits 5.4 kilograms of carbon dioxide and 0.05 kilograms of methane.</desc>
<style>
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
  .name { font-size: 13px; fill: #16212E; }
  .sub { font-size: 12px; fill: #6B665A; }
  .title { font-size: 14px; fill: #16212E; }
  .flow { stroke: #4C5664; stroke-width: 1.4; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4C5664" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="340" fill="#ffffff"/>

<rect x="45" y="150" width="200" height="70" rx="6" fill="#F1EFE8" stroke="#6B665A" stroke-width="0.75"/>
<text class="title" x="145" y="185" text-anchor="middle" dominant-baseline="central">Production of fuel</text>

<rect x="400" y="150" width="200" height="70" rx="6" fill="#F1EFE8" stroke="#6B665A" stroke-width="0.75"/>
<text class="title" x="500" y="185" text-anchor="middle" dominant-baseline="central">Production of electricity</text>

<line class="flow" x1="100" y1="220" x2="100" y2="287" marker-end="url(#a)"/>
<text class="sub" x="100" y="307" text-anchor="middle">30 kg</text>
<text class="name" x="100" y="324" text-anchor="middle">CO2</text>

<line class="flow" x1="185" y1="220" x2="185" y2="287" marker-end="url(#a)"/>
<text class="sub" x="185" y="307" text-anchor="middle">10 kg</text>
<text class="name" x="185" y="324" text-anchor="middle">CH4</text>

<line class="flow" x1="455" y1="220" x2="455" y2="287" marker-end="url(#a)"/>
<text class="sub" x="455" y="307" text-anchor="middle">5.4 kg</text>
<text class="name" x="455" y="324" text-anchor="middle">CO2</text>

<line class="flow" x1="545" y1="220" x2="545" y2="287" marker-end="url(#a)"/>
<text class="sub" x="545" y="307" text-anchor="middle">0.05 kg</text>
<text class="name" x="545" y="324" text-anchor="middle">CH4</text>

<line class="flow" x1="145" y1="80" x2="145" y2="148" marker-end="url(#a)"/>
<text class="sub" x="145" y="45" text-anchor="middle">50 L</text>
<text class="name" x="145" y="62" text-anchor="middle">Crude oil</text>

<line class="flow" x1="247" y1="185" x2="300" y2="185" marker-end="url(#a)"/>
<text class="sub" x="285" y="155" text-anchor="middle">100 L</text>
<text class="name" x="285" y="172" text-anchor="middle">Fuel</text>

<line class="flow" x1="345" y1="185" x2="398" y2="185" marker-end="url(#a)"/>
<text class="sub" x="360" y="155" text-anchor="middle">2 L</text>
<text class="name" x="360" y="172" text-anchor="middle">Fuel</text>

<line class="flow" x1="602" y1="185" x2="648" y2="185" marker-end="url(#a)"/>
<text class="sub" x="625" y="155" text-anchor="middle">10 kWh</text>
<text class="name" x="625" y="172" text-anchor="middle">Electricity</text>
</svg>
