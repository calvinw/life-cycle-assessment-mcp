<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img">
<title>The system structure with no quantities</title>
<desc>Crude oil enters fuel production, which outputs fuel and emits carbon dioxide and methane. Fuel enters electricity production, which outputs electricity and emits carbon dioxide and methane.</desc>
<style>
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
  .name { font-size: 13px; fill: #16212E; }
  .title { font-size: 14px; fill: #16212E; }
  .flow { stroke: #4C5664; stroke-width: 1.4; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4C5664" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="330" fill="#ffffff"/>

<rect x="45" y="145" width="200" height="70" rx="6" fill="#F1EFE8" stroke="#6B665A" stroke-width="0.75"/>
<text class="title" x="145" y="180" text-anchor="middle" dominant-baseline="central">Production of fuel</text>

<rect x="400" y="145" width="200" height="70" rx="6" fill="#F1EFE8" stroke="#6B665A" stroke-width="0.75"/>
<text class="title" x="500" y="180" text-anchor="middle" dominant-baseline="central">Production of electricity</text>

<line class="flow" x1="100" y1="215" x2="100" y2="275" marker-end="url(#a)"/>
<text class="name" x="100" y="296" text-anchor="middle">CO2</text>

<line class="flow" x1="185" y1="215" x2="185" y2="275" marker-end="url(#a)"/>
<text class="name" x="185" y="296" text-anchor="middle">CH4</text>

<line class="flow" x1="455" y1="215" x2="455" y2="275" marker-end="url(#a)"/>
<text class="name" x="455" y="296" text-anchor="middle">CO2</text>

<line class="flow" x1="545" y1="215" x2="545" y2="275" marker-end="url(#a)"/>
<text class="name" x="545" y="296" text-anchor="middle">CH4</text>

<line class="flow" x1="145" y1="80" x2="145" y2="143" marker-end="url(#a)"/>
<text class="name" x="145" y="65" text-anchor="middle">Crude oil</text>

<line class="flow" x1="247" y1="180" x2="398" y2="180" marker-end="url(#a)"/>
<text class="name" x="322" y="166" text-anchor="middle">Fuel</text>

<line class="flow" x1="602" y1="180" x2="648" y2="180" marker-end="url(#a)"/>
<text class="name" x="625" y="166" text-anchor="middle">Electricity</text>
</svg>
