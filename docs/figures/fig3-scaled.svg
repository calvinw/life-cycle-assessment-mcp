<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img">
<title>Both processes scaled to deliver 1000 kilowatt hours</title>
<desc>The fuel process runs twice and the electricity process one hundred times. Scaled values appear above the original reference values, which are crossed out.</desc>
<style>
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; }
  .name { font-size: 13px; fill: #16212E; }
  .title { font-size: 14px; fill: #16212E; }
  .new { font-size: 13.5px; font-weight: 500; fill: #0B6E5F; }
  .old { font-size: 12px; fill: #9C978A; }
  .run { font-size: 12px; fill: #0B6E5F; }
  .flow { stroke: #4C5664; stroke-width: 1.4; }
  .strike { stroke: #9C978A; stroke-width: 1.2; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4C5664" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="360" fill="#ffffff"/>

<rect x="45" y="150" width="200" height="70" rx="6" fill="#F1EFE8" stroke="#6B665A" stroke-width="0.75"/>
<text class="title" x="145" y="176" text-anchor="middle" dominant-baseline="central">Production of fuel</text>
<text class="run" x="145" y="197" text-anchor="middle" dominant-baseline="central">s<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="12"> = 2</tspan></text>

<rect x="400" y="150" width="200" height="70" rx="6" fill="#F1EFE8" stroke="#6B665A" stroke-width="0.75"/>
<text class="title" x="500" y="176" text-anchor="middle" dominant-baseline="central">Production of electricity</text>
<text class="run" x="500" y="197" text-anchor="middle" dominant-baseline="central">s<tspan dy="3" font-size="10">2</tspan><tspan dy="-3" font-size="12"> = 100</tspan></text>

<line class="flow" x1="100" y1="150" x2="100" y2="108" marker-end="url(#a)"/>
<text class="new" x="100" y="58" text-anchor="middle">60 kg</text>
<text class="old" x="100" y="78" text-anchor="middle">30 kg</text>
<line class="strike" x1="78" y1="74" x2="122" y2="74"/>
<text class="name" x="100" y="97" text-anchor="middle">CO2</text>

<line class="flow" x1="185" y1="150" x2="185" y2="108" marker-end="url(#a)"/>
<text class="new" x="185" y="58" text-anchor="middle">20 kg</text>
<text class="old" x="185" y="78" text-anchor="middle">10 kg</text>
<line class="strike" x1="164" y1="74" x2="206" y2="74"/>
<text class="name" x="185" y="97" text-anchor="middle">CH4</text>

<line class="flow" x1="455" y1="150" x2="455" y2="108" marker-end="url(#a)"/>
<text class="new" x="455" y="58" text-anchor="middle">540 kg</text>
<text class="old" x="455" y="78" text-anchor="middle">5.4 kg</text>
<line class="strike" x1="430" y1="74" x2="480" y2="74"/>
<text class="name" x="455" y="97" text-anchor="middle">CO2</text>

<line class="flow" x1="545" y1="150" x2="545" y2="108" marker-end="url(#a)"/>
<text class="new" x="545" y="58" text-anchor="middle">5 kg</text>
<text class="old" x="545" y="78" text-anchor="middle">0.05 kg</text>
<line class="strike" x1="516" y1="74" x2="574" y2="74"/>
<text class="name" x="545" y="97" text-anchor="middle">CH4</text>

<line class="flow" x1="145" y1="298" x2="145" y2="222" marker-end="url(#a)"/>
<text class="new" x="145" y="314" text-anchor="middle">100 L</text>
<text class="old" x="145" y="333" text-anchor="middle">50 L</text>
<line class="strike" x1="128" y1="329" x2="162" y2="329"/>
<text class="name" x="145" y="352" text-anchor="middle">Crude oil</text>

<line class="flow" x1="247" y1="185" x2="300" y2="185" marker-end="url(#a)"/>
<text class="new" x="285" y="132" text-anchor="middle">200 L</text>
<text class="old" x="285" y="151" text-anchor="middle">100 L</text>
<line class="strike" x1="263" y1="147" x2="307" y2="147"/>
<text class="name" x="285" y="170" text-anchor="middle">Fuel</text>

<line class="flow" x1="345" y1="185" x2="398" y2="185" marker-end="url(#a)"/>
<text class="new" x="360" y="132" text-anchor="middle">200 L</text>
<text class="old" x="360" y="151" text-anchor="middle">2 L</text>
<line class="strike" x1="345" y1="147" x2="375" y2="147"/>
<text class="name" x="360" y="170" text-anchor="middle">Fuel</text>

<line class="flow" x1="602" y1="185" x2="648" y2="185" marker-end="url(#a)"/>
<text class="new" x="625" y="132" text-anchor="middle">1000 kWh</text>
<text class="old" x="625" y="151" text-anchor="middle">10 kWh</text>
<line class="strike" x1="601" y1="147" x2="649" y2="147"/>
<text class="name" x="625" y="170" text-anchor="middle">Electricity</text>
</svg>
